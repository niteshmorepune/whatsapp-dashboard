services:
  app:
    build: .
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_WABA_ID=${META_WABA_ID}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
      # 2026-09-09 — these were all correctly set in .env but never actually
      # reached the container: Compose only injects a variable into the
      # service if it's named here, regardless of what .env defines. Real
      # incident, caught while wiring CRM_GOAL_CAPTURE_URL through for the
      # lead-goal-capture flow — `docker compose exec app env` showed NONE
      # of these present, meaning notifyCrm()/getCrmLeadContext() had been
      # silently no-op-ing (both fail silently by design when their env
      # vars are missing), generateAiReply() had been returning null on
      # every call (ANTHROPIC_API_KEY missing), web push had been silently
      # failing (VAPID_*), and the CRM's own server-to-server calls into
      # this app may have been rejected (WADESK_SERVICE_KEY) — since
      # whenever this file was last in this shape. Not a new gap this
      # feature introduced; a pre-existing one this feature's own debugging
      # surfaced.
      - WADESK_SERVICE_KEY=${WADESK_SERVICE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CRM_WEBHOOK_URL=${CRM_WEBHOOK_URL}
      - CRM_WEBHOOK_TOKEN=${CRM_WEBHOOK_TOKEN}
      - CRM_LEAD_CONTEXT_URL=${CRM_LEAD_CONTEXT_URL}
      - CRM_MESSAGE_FAILED_URL=${CRM_MESSAGE_FAILED_URL}
      - CRM_GOAL_CAPTURE_URL=${CRM_GOAL_CAPTURE_URL}
      - NEXT_PUBLIC_VAPID_PUBLIC_KEY=${NEXT_PUBLIC_VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      # WhatsApp Calling API audio fix, 2026-09-10 — see
      # api/calls/turn-credentials/route.ts. Same "must be listed here or
      # Compose never passes it through" gotcha as every var above.
      - CLOUDFLARE_TURN_KEY_ID=${CLOUDFLARE_TURN_KEY_ID}
      - CLOUDFLARE_TURN_KEY_API_TOKEN=${CLOUDFLARE_TURN_KEY_API_TOKEN}
      # Syncs an answered WhatsApp call into the CRM's own CallLog — see
      # src/lib/call-summary.ts's syncCompletedCallToCrm().
      - CRM_CALL_LOG_URL=${CRM_CALL_LOG_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whatsapp-dashboard.rule=Host(`wadesk.in`) || Host(`www.wadesk.in`)"
      - "traefik.http.routers.whatsapp-dashboard.entrypoints=web,websecure"
      - "traefik.http.routers.whatsapp-dashboard.tls=true"
      - "traefik.http.routers.whatsapp-dashboard.tls.certresolver=myhttpchallenge"
      - "traefik.http.services.whatsapp-dashboard.loadbalancer.server.port=3000"
      - "traefik.docker.network=root_default"

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: whatsapp_dashboard
      MYSQL_USER: whatsapp_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s

networks:
  internal:
    driver: bridge
  root_default:
    external: true

volumes:
  mysql_data:
