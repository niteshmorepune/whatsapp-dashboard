services:
  app:
    build: .
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_PHONE_NUMBER_ID=${META_PHONE_NUMBER_ID}
      - META_WABA_ID=${META_WABA_ID}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whatsapp-dashboard.rule=Host(`wadesk.in`) || Host(`www.wadesk.in`)"
      - "traefik.http.routers.whatsapp-dashboard.entrypoints=web,websecure"
      - "traefik.http.routers.whatsapp-dashboard.tls=true"
      - "traefik.http.routers.whatsapp-dashboard.tls.certresolver=myhttpchallenge"
      - "traefik.http.services.whatsapp-dashboard.loadbalancer.server.port=3000"
      - "traefik.docker.network=root_default"

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: whatsapp_dashboard
      MYSQL_USER: whatsapp_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10
      interval: 5s

networks:
  internal:
    driver: bridge
  root_default:
    external: true

volumes:
  mysql_data:
